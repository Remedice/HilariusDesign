<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <!--
      Static form definition for the @netlify/plugin-nextjs runtime.
      The interactive UI lives in src/views/Page/Page.jsx (ContactPage).
      The React form POSTs here (not "/") so the submission reaches Netlify
      Forms instead of being intercepted by the Next.js handler.
      Field names MUST match the React form.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
