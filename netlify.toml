# Build config for the full Next.js runtime on Netlify.
# The Next.js runtime deploys the `.next` production build. Do not use `out/`;
# that is a leftover from the old static export and breaks SSR/middleware and
# Netlify Forms.

[build]
  command = "next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
